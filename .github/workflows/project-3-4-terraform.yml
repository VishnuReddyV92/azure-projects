name: project-3-4-terraform

on:
  pull_request:
    paths:
      - 'projects/project-3-4-aks-keyvault/terraform/**'
  push:
    branches: [main]
    paths:
      - 'projects/project-3-4-aks-keyvault/terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-3-4-aks-keyvault/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - if: github.event_name == 'pull_request'
        run: terraform plan
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
